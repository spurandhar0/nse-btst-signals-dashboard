name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
          name: github-pages-${{ github.run_attempt }}

      - name: Wait for the Pages artifact to be listed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..12}; do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" \
                --jq '.artifacts[] | select(.expired == false) | .id' | grep -q '[0-9]'; then
              exit 0
            fi
            sleep 5
          done
          echo "Pages artifact $ARTIFACT_NAME was not listed after 60 seconds."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

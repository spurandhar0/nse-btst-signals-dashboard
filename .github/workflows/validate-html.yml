name: Validate Dashboard JS

on:
  push:
    paths:
      - 'docs/index.html'
  pull_request:
    paths:
      - 'docs/index.html'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract and validate JavaScript from index.html
        run: |
          node << 'SCRIPT'
          const fs = require('fs');
          const html = fs.readFileSync('docs/index.html', 'utf8');

          // Extract all <script> blocks (not src= ones)
          const scriptRegex = /<script(?![^>]*\bsrc\b)[^>]*>([\s\S]*?)<\/script>/gi;
          let match;
          let allJS = '';
          let blockNum = 0;

          while ((match = scriptRegex.exec(html)) !== null) {
            blockNum++;
            allJS += match[1] + '\n';
          }

          if (!allJS.trim()) {
            console.error('❌ No inline <script> blocks found in index.html');
            process.exit(1);
          }

          console.log(`Found ${blockNum} script block(s). Validating...`);

          // Write to temp file and parse with Node (syntax check)
          fs.writeFileSync('/tmp/extracted.js', allJS);

          try {
            // Use node --check for syntax validation
            const { execSync } = require('child_process');
            execSync('node --check /tmp/extracted.js', { stdio: 'pipe' });
            console.log('✅ JavaScript syntax is valid!');
          } catch (e) {
            console.error('❌ JavaScript syntax error detected:');
            console.error(e.stderr ? e.stderr.toString() : e.message);
            process.exit(1);
          }
          SCRIPT

      - name: Check for common HTML/JS pitfalls
        run: |
          python3 << 'SCRIPT'
          import re, sys

          with open('docs/index.html', 'r', encoding='utf-8') as f:
              html = f.read()

          errors = []

          # Find all inline script blocks
          script_re = re.compile(r'<script(?![^>]*\bsrc\b)[^>]*>(.*?)</script>', re.DOTALL | re.IGNORECASE)
          blocks = script_re.findall(html)

          for i, block in enumerate(blocks, 1):
              lines = block.split('\n')
              for lineno, line in enumerate(lines, 1):
                  # Check for literal newlines inside single/double-quoted strings (common bug)
                  # A line that starts mid-string (no quote opener) is suspicious
                  # Simple heuristic: very short line inside what looks like a string concat
                  pass

          # Check: does any JS string literal contain a raw </script> tag?
          raw_close = re.search(r"""(['"`]).*?</script>.*?\1""", html, re.DOTALL)
          if raw_close:
              errors.append(f"WARNING: Found '</script>' inside a JS string literal — this can terminate the script block early!")

          if errors:
              print("⚠️  Potential issues found:")
              for e in errors:
                  print(f"  • {e}")
              # Don't fail on warnings, just report
          else:
              print("✅ No common HTML/JS pitfalls detected.")
          SCRIPT
